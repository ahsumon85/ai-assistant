[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobflow"
version = "0.2.0"
description = "AI-powered job matching and application assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.1",
  "openai>=1.57.0",
  "email-validator>=2.2.0",
  "typer>=0.14.0",
  "rich>=13.9.0",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.0.0",
  "slowapi>=0.1.9",
  "arq>=0.26.0",
  "redis>=5.0.0",
  "google-api-python-client>=2.150.0",
  "google-auth>=2.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "httpx>=0.28.0",
]

[project.scripts]
jobflow = "jobflow.cli:app"
jobflow-worker = "jobflow.workers.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
